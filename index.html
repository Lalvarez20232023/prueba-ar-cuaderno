<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Realidad aumentada — esfera fija</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}
.a-enter-vr,.a-enter-ar{display:none!important}
#info{position:fixed;z-index:50;top:12px;left:12px;right:12px;background:rgba(10,20,30,.8);padding:12px;border-radius:10px;color:white;font-size:14px;pointer-events:none}
#status{display:block;margin-top:5px;font-size:12px;color:#facc15}
/* AR.js gestiona la cámara y el canvas: no forzar ambos elementos a z-index ni a fixed. */
</style>
</head>
<body>
<div id="info"><strong>Esfera fija sobre marcador Hiro</strong><span id="status">Buscando marcador…</span></div>
<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true" arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
<a-marker id="hiro" preset="hiro" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
  <!-- Posición fija relativa al centro del marcador. Ejes X/Z sobre el plano; Y vertical. -->
  <a-sphere position="0 0.20 0" radius="0.20" color="#ff3158" material="roughness: 0.4; metalness: 0.05"></a-sphere>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
const marker=document.getElementById('hiro');
const status=document.getElementById('status');
marker.addEventListener('markerFound',()=>{status.textContent='Marcador detectado: esfera anclada';status.style.color='#86efac'});
marker.addEventListener('markerLost',()=>{status.textContent='Buscando marcador…';status.style.color='#facc15'});
</script>
</body>
</html>
